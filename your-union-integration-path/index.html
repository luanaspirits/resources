<style>

    --text: #f5eefb; --muted: #b8a4d4; --muted-2: #8a76ac;
    --violet: #a988e8; --violet-deep: #7a5bc4; --periwinkle: #8ca8e8;

  body {
    background: radial-gradient(ellipse at 15% 0%, #4a2c6e60 0%, transparent 55%),
                radial-gradient(ellipse at 88% 10%, #8ca8e830 0%, transparent 48%),
                radial-gradient(ellipse at 50% 105%, #d4af5f25 0%, transparent 55%), var(--bg);
    color: var(--text); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; position: relative;
  }
  #sparkles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .spark { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff, var(--violet) 70%, transparent 100%); animation: twinkle 4.5s ease-in-out infinite; }

  #app { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; padding: 0 20px 60px; }
  h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--text); margin-bottom: 12px; }
  h1 { font-weight: 700; font-size: 27px; line-height: 1.3; }
  h2 { font-weight: 600; font-size: 21px; }
  h3 { font-weight: 600; font-size: 16px; }
  p { line-height: 1.75; color: var(--muted); font-size: 14.5px; margin-bottom: 14px; }
  em.hl { font-style: italic; color: var(--gold-soft); }
  .tagline { font-family: 'Playfair Display', serif; font-style: italic; color: var(--gold-soft); font-size: 16.5px; text-align: center; margin: 16px 0; }
  .eyebrow { font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .center { text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-bottom: 16px; box-shadow: 0 8px 30px rgba(107,79,160,0.06); }

  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'Jost', sans-serif; font-weight: 700; font-size: 14px; padding: 13px 26px; border-radius: 999px; border: none; cursor: pointer; text-decoration: none; }
  .btn.gold { background: linear-gradient(135deg, var(--violet), var(--periwinkle)); color: #fff; box-shadow: 0 6px 20px rgba(155,127,212,0.35); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-strong); }
  .btn.small { padding: 8px 16px; font-size: 12px; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  input[type=text] { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: 'Jost', sans-serif; font-size: 16px; color: var(--text); margin-bottom: 16px; }
  input[type=text]::placeholder { color: var(--muted-2); }
  textarea { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-family: 'Jost', sans-serif; font-size: 14.5px; padding: 13px; resize: vertical; min-height: 70px; margin-bottom: 14px; }
  .journal-q { font-size: 13.5px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .topbar-left { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 10px; }
  .topbar-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--violet), var(--periwinkle)); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 16px rgba(155,127,212,0.4); flex-shrink: 0; }
  .topbar-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: var(--text); }

  .topnav-brand-row .icon { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--violet), var(--periwinkle)); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .topnav-brand-row .name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 13px; color: var(--text); }
  .topnav-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; color: var(--text); text-decoration: none; }
  .icon-btn:hover { border-color: var(--violet); }
  .position-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: var(--gold); text-align: center; margin-bottom: 8px; }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 5px; background: rgba(0,0,0,0.15); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  .nav-grid-item { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2px; color: var(--muted-2); text-align: center; padding: 9px 6px; border-radius: 9px; cursor: pointer; line-height: 1.3; }
  .nav-grid-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-grid-item.active { background: linear-gradient(135deg, var(--violet), var(--periwinkle)); color: #fff; font-weight: 700; }

  .step-progress { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted-2); text-align: center; margin-bottom: 8px; }
  .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .step-dot.active { background: var(--violet); width: 20px; border-radius: 4px; }
  .step-dot.done { background: var(--gold); }

  .breathe-wrap { display: flex; flex-direction: column; align-items: center; padding: 12px 0 4px; }
  .breathe-ball { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--periwinkle) 45%, var(--violet) 100%); box-shadow: 0 0 40px rgba(155,127,212,0.4); transition: transform 4s ease-in-out; margin-bottom: 16px; }
  .breathe-label { font-family: 'Playfair Display', serif; font-size: 16px; min-height: 22px; text-align: center; color: var(--text); }

  .checklist { display: flex; flex-direction: column; gap: 9px; margin: 14px 0; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .check-box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-strong); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
  .check-box.done { background: linear-gradient(135deg, var(--violet), var(--periwinkle)); border-color: transparent; }
  .check-text { font-size: 13.5px; color: var(--text); line-height: 1.55; }
  .check-text.done { color: var(--muted-2); text-decoration: line-through; }

  .progress-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px; color: var(--gold-soft); margin-bottom: 14px; }
  .day-pills-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .day-pill { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid var(--line); cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
  .day-pill.active { background: linear-gradient(135deg, var(--violet), var(--periwinkle)); color: #fff; border-color: transparent; font-weight: 700; }
  .day-pill.done { border-color: var(--gold); }
  .day-badge { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--gold); }
  .resource-item { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; }
  .resource-check { width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line-strong); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; cursor: pointer; }
  .resource-icon { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(135deg, var(--gold-soft), var(--violet)); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .resource-check.done { background: linear-gradient(135deg, var(--violet), var(--periwinkle)); border-color: transparent; }
  .resource-body { flex: 1; }
  .resource-t { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .resource-d { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
  .resource-link { display: inline-block; margin-top: 10px; color: var(--periwinkle); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--periwinkle); }
  .taste-item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .taste-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--violet), var(--periwinkle)); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .taste-item .t { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 600; color: var(--text); }
  .taste-item .s { font-size: 11.5px; color: var(--muted-2); }
  .tier-badge { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 999px; font-weight: 500; margin-left: 6px; }
  .tier-badge.premium { background: rgba(201,164,78,0.16); color: var(--gold); border: 1px solid rgba(201,164,78,0.4); }
  .tier-badge.standard { background: rgba(155,127,212,0.14); color: var(--violet); border: 1px solid rgba(155,127,212,0.35); }

  .section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin: 20px 0 8px; }
  .accordion-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 18px; cursor: pointer; margin-bottom: 10px; }
  .accordion-item:hover { border-color: var(--violet); }
  .accordion-item .t { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 600; color: var(--text); }
  .accordion-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.65; }
  .tap-hint { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-2); margin-top: 4px; }
  .quiz-progress { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--muted-2); margin-bottom: 8px; }
  .choice-list { display: flex; flex-direction: column; gap: 9px; }
  .choice { background: rgba(0,0,0,0.15); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 13.5px; color: var(--text); }
  .choice:hover { border-color: var(--violet); background: rgba(155,127,212,0.08); }

  .concept-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  @media (max-width: 420px) { .concept-grid { grid-template-columns: 1fr; } }
  .concept-flip-scene { perspective: 1000px; }
  .concept-flip-card { position: relative; width: 100%; height: 170px; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .concept-flip-card.flipped { transform: rotateY(180deg); }
  .concept-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  .concept-front { background: linear-gradient(160deg, var(--violet-deep), var(--violet)); border: 1.5px solid rgba(255,255,255,0.3); }
  .concept-back { background: linear-gradient(160deg, var(--violet), var(--periwinkle)); border: 1.5px solid rgba(255,255,255,0.3); transform: rotateY(180deg); }
  .concept-term { font-family: 'Playfair Display', serif; font-size: 14.5px; font-weight: 600; color: #fff; margin-top: 6px; }
  .concept-pain { font-family: 'Playfair Display', serif; font-style: italic; font-size: 11.5px; color: rgba(255,255,255,0.85); margin-bottom: 6px; }
  .concept-desc { font-size: 10.5px; color: rgba(255,255,255,0.95); line-height: 1.5; margin-bottom: 8px; }
  .concept-link { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.5px; color: #fff; text-decoration: underline; }

  .flip-scene { perspective: 1200px; display: flex; justify-content: center; margin-bottom: 20px; }
  .flip-card { position: relative; width: 210px; height: 300px; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
  .flip-back { background: linear-gradient(160deg, var(--violet-deep), var(--violet)); border: 2px solid rgba(255,255,255,0.5); }
  .flip-front { transform: rotateY(180deg); border: 2px solid rgba(255,255,255,0.5); }
  .card-arcana { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 2px; color: rgba(255,255,255,0.7); margin-top: 8px; }
  .card-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: #fff; margin-top: 6px; line-height: 1.15; }
  .message-card { background: linear-gradient(150deg, rgba(155,127,212,0.14), rgba(140,168,232,0.10)); border: 1px solid var(--line-strong); border-radius: 18px; padding: 22px; margin-bottom: 12px; }
  .message-card p { color: var(--text); font-family: 'Playfair Display', serif; font-style: italic; font-size: 15.5px; line-height: 1.7; margin: 0; }
  .affirmation-card { background: linear-gradient(150deg, rgba(212,175,95,0.16), rgba(155,127,212,0.10)); border: 1px solid var(--gold); border-radius: 18px; padding: 20px 22px; margin-bottom: 16px; }
  .affirmation-card p { color: var(--gold-soft); font-family: 'Playfair Display', serif; font-style: italic; font-size: 15.5px; line-height: 1.6; }
  .hint { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted-2); }
  .entry { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  .entry:last-child { border: none; margin: 0; padding: 0; }
  .entry .tt { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 600; color: var(--gold-soft); margin-bottom: 2px; }
  .entry .meta { font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--muted-2); margin-bottom: 4px; }
  .entry .a { font-size: 12.5px; color: var(--muted); font-style: italic; }

  .save-note { background: rgba(201,164,78,0.10); border: 1px solid var(--gold); border-radius: 14px; padding: 14px 18px; font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .tier-compare { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .tier-col { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .tier-col.premium { border-color: var(--gold); background: linear-gradient(150deg, rgba(212,175,95,0.10), rgba(155,127,212,0.08)); }
  .tier-col-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .tier-col-title.standard { color: var(--periwinkle); }
  .tier-col-title.premium { color: var(--gold); }
  .tier-col-price { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted-2); margin-bottom: 12px; line-height: 1.6; }
  .tier-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .tier-col li { font-size: 13px; color: var(--text); line-height: 1.5; padding-left: 18px; position: relative; }
  .tier-col li::before { content: "\2726"; position: absolute; left: 0; color: var(--gold); font-size: 11px; top: 2px; }

  .site-footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); text-align: center; }
  .site-footer .brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--text); }
  .site-footer .brand em { font-style: italic; color: var(--gold); }
  .site-footer .links { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--muted-2); line-height: 1.9; }
  .site-footer a { color: var(--muted-2); text-decoration: none; }
</style>
</head>

<script>
(function initSparkles() {
  const wrap = document.getElementById("sparkles");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    const size = 2 + Math.random() * 4;
    s.style.width = size + "px"; s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 4.5) + "s";
    wrap.appendChild(s);
  }
  const glyphs = ["\u2727", "\u2726", "\u263D", "\u2729", "\u2734"];
  for (let i = 0; i < 10; i++) {
    const g = document.createElement("div");
    g.className = "glyph-spark";
    g.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    g.style.fontSize = (10 + Math.random() * 14) + "px";
    g.style.left = Math.random() * 100 + "%"; g.style.top = Math.random() * 100 + "%";
    g.style.animationDelay = (Math.random() * 5) + "s";
    g.style.color = Math.random() > 0.5 ? "var(--gold-soft)" : "var(--periwinkle)";
    wrap.appendChild(g);
  }
})();

let breathTimer = null;
const BOX_PHASES = ["Breathe in...", "Hold...", "Breathe out...", "Hold..."];

function groundHtml() {
  if (state.selfDone) return groundCompleteHtml();
  const step = SELF_STEPS[state.selfStep];

  return `

    <h2>${step.letter} \u2014 ${step.word}</h2>

    ` : ""}
    <div class="card">

      <textarea id="selfField">${state.selfAnswers[state.selfStep] || ""}</textarea>
    </div>
    <div class="btn-row">

    </div>
  `;
}

function selfNav(dir) {
  state.selfAnswers[state.selfStep] = document.getElementById("selfField").value;
  go({ selfStep: state.selfStep + dir });
}

function finishSelf() {
  state.selfAnswers[state.selfStep] = document.getElementById("selfField").value;
  go({ selfDone: true });
}

function toggleBreathing() {
  const ball = document.getElementById("breatheBall");
  const label = document.getElementById("breatheLabel");
  const btn = document.getElementById("breatheBtn");
  if (state.breathing) {
    state.breathing = false; clearTimeout(breathTimer);
    ball.style.transform = "scale(1)"; label.textContent = "Press start when you're ready"; btn.textContent = "Start Breathing";
    return;
  }
  state.breathing = true; btn.textContent = "Stop";
  let phase = 0;
  const runPhase = () => {
    if (!state.breathing) return;
    label.textContent = BOX_PHASES[phase];
    ball.style.transition = "transform 4s ease-in-out";
    if (phase === 0) ball.style.transform = "scale(1.35)";
    else if (phase === 2) ball.style.transform = "scale(1)";
    phase = (phase + 1) % 4;
    breathTimer = setTimeout(runPhase, 4000);
  };
  runPhase();
}

  };
  const doneCount = TRACKER_DAYS.filter((d, i) => dayDone(i)).length;

  const pills = TRACKER_DAYS.map((d, i) => {

    return `<div class="day-pill ${n === i ? "active" : ""} ${done ? "done" : ""}" onclick="go({trackerDay:${i}})">${i + 1}</div>`;
  }).join("");

  const existing = state.trackerAnswers[n] || {};
  const promptFields = day.prompts.map((p, i) => `
    <div class="journal-q" style="margin-top:${i > 0 ? "16px" : "8px"};">${p}</div>
    <textarea id="trackerField-${i}">${existing[i] || ""}</textarea>

  return `

    <p>Consistency is the whole practice. A few minutes a day, each one guiding you a little closer to connecting with your union self, the version of you already living in alignment.</p>

    </div>

      ${!isFirst ? `<button class="btn ghost small" onclick="trackerNav(-1)">&larr; Day ${n}</button>` : `<span></span>`}

}

function collectTrackerAnswers(dayIndex) {
  const day = TRACKER_DAYS[dayIndex];

  day.prompts.forEach((p, i) => {
    const el = document.getElementById("trackerField-" + i);
    if (el) answers[i] = el.value;
  });
  return answers;
}

function downloadFullJournal() {
  let text = "YOUR UNION INTEGRATION PATH\nMy Full Journal\n\n";
  let any = false;

  if (state.reflect1 || state.reflect2) {
    any = true;
    text += "== REFLECT ON YOUR READING ==\n";
    if (state.reflect1) text += "What stood out most to you?\n" + state.reflect1 + "\n\n";
    if (state.reflect2) text += "What you want to remember\n" + state.reflect2 + "\n\n";
  }

  if (Object.keys(state.selfAnswers).length) {
    any = true;
    text += "== GROUND, S.E.L.F. METHOD PRACTICE ==\n";
    SELF_STEPS.forEach((s, i) => { if (state.selfAnswers[i]) text += s.letter + ", " + s.word + ": " + s.prompt + "\n" + state.selfAnswers[i] + "\n\n"; });
  }

  const trackerDaysWithAnswers = Object.keys(state.trackerAnswers).filter(k => {
    const ans = state.trackerAnswers[k];
    return ans && Object.values(ans).some(v => v && v.trim());
  });
  if (trackerDaysWithAnswers.length) {
    any = true;
    text += "== YOUR 7-DAY UNION SELF JOURNAL ==\n";
    trackerDaysWithAnswers.forEach(k => {
      const day = TRACKER_DAYS[k];
      const ans = state.trackerAnswers[k];
      text += "Day " + (parseInt(k) + 1) + ", " + day.title + "\n";
      day.prompts.forEach((p, i) => { if (ans[i]) text += p + "\n" + ans[i] + "\n\n"; });
    });
  }

  if (state.dailyCardHistory.length) {
    any = true;
    text += "== DAILY CARD PULLS ==\n";
    state.dailyCardHistory.forEach(h => { text += h.date + ", " + h.name + "\n\"" + h.affirmation + "\"\n\n"; });
  }

  if (!any) text += "No entries yet.\n";

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "your-union-integration-path-journal.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function drawDailyCard() {
  const card = DAILY_DECK[Math.floor(Math.random() * DAILY_DECK.length)];
  const today = todayStr();
  state.dailyCard = { date: today, card };
  state.dailyCardFlipped = false;
  state.dailyCardHistory = [{ date: today, name: card.name, affirmation: card.affirmation }, ...state.dailyCardHistory.filter(h => h.date !== today)];
  render();
}

function flipDailyCard() {
  state.dailyCardFlipped = true;
  render();
}

function dailyCardHistoryHtml() {
  if (!state.dailyCardHistory.length) return "";
  const rows = state.dailyCardHistory.slice(0, 10).map(h => `<div class="entry"><div class="tt">${h.name}</div><div class="meta">${h.date}</div><div class="a">"${h.affirmation}"</div></div>`).join("");
  return `<div class="section-label">Recent Pulls</div><div class="card">${rows}</div>`;
}

  const doneCount = FOUNDATIONS_RESOURCES.filter((r, i) => state.foundationsChecked[i]).length;

        <div class="resource-d">${r.desc}</div>

  return `

    <h2>Foundations For Union</h2>

  `;

function toggleFoundations(i) {
  state.foundationsChecked[i] = !state.foundationsChecked[i];

}

}

  return `

function togglePreview() {
  state.previewOpen = !state.previewOpen;
  render();
}

function flipConcept(i) {
  state.flippedConcepts[i] = !state.flippedConcepts[i];
  render();
}

function tierQuizHtml() {
  if (state.tierQuizResult) {
    const result = state.tierQuizResult;
    const plan = PLANS[result];
    const isPremium = result === "premium";
    return `
      <div class="section-label">Your Recommendation</div>
      <div class="card ritual center">
        <div style="font-size:30px; margin-bottom:8px;">${isPremium ? "\u2728" : "\u{1F338}"}</div>
        <h3>${isPremium ? "Premium Sounds Right For You" : "Standard Is A Great Place To Start"}</h3>
        <p>${isPremium ? "Based on your answers, it sounds like you're ready for the full A-Z process, live support, and everything the deepest layer of the Academy offers." : "Based on your answers, Standard gives you real momentum right now, and you can always go deeper into Premium whenever you're ready."}</p>
        <div class="btn-row" style="justify-content:center;">
          <a class="btn gold" href="${PLANS_URL}" target="_blank" rel="noopener">${isPremium ? "Join Premium" : "Join Standard"} &rarr;</a>
          <button class="btn ghost small" onclick="resetTierQuiz()">Retake Quiz</button>
        </div>
      </div>
    `;
  }
  const q = TIER_QUIZ[state.tierQuizStep];
  const optionsHtml = q.options.map(o => `<div class="choice" onclick="answerTierQuiz(${o.weight})">${o.label}</div>`).join("");
  return `
    <div class="section-label">Which Tier Is Right For You?</div>
    <div class="card">
      <div class="quiz-progress">QUESTION ${state.tierQuizStep + 1} OF ${TIER_QUIZ.length}</div>
      <div class="journal-q" style="font-size:15px; margin-bottom:10px;">${q.q}</div>
      <div class="choice-list">${optionsHtml}</div>
    </div>
  `;
}

function answerTierQuiz(weight) {
  const answers = [...state.tierQuizAnswers, weight];
  if (state.tierQuizStep < TIER_QUIZ.length - 1) {
    go({ tierQuizAnswers: answers, tierQuizStep: state.tierQuizStep + 1 });
  } else {
    const total = answers.reduce((a, b) => a + b, 0);
    const result = total >= 2 ? "premium" : "standard";
    go({ tierQuizAnswers: answers, tierQuizResult: result });
  }
}

function resetTierQuiz() {
  go({ tierQuizStep: 0, tierQuizAnswers: [], tierQuizResult: null });
}

function plansHtml() {
  return `
    <div class="tier-compare">
      <div class="tier-col">
        <div class="tier-col-title standard">Standard</div>
        <div class="tier-col-price">${PLANS.standard.price}<br><span>${PLANS.standard.trial}</span></div>
        <ul>${PLANS.standard.features.map(f => `<li>${f}</li>`).join("")}</ul>
        <a class="btn gold small" href="${PLANS_URL}" target="_blank" rel="noopener" style="margin-top:14px; display:inline-block;">Join Standard &rarr;</a>
      </div>
      <div class="tier-col premium">
        <div class="tier-col-title premium">Premium</div>
        <div class="tier-col-price">${PLANS.premium.price}<br><span>${PLANS.premium.trial}</span></div>
        <ul>${PLANS.premium.features.map(f => `<li>${f}</li>`).join("")}</ul>
        <a class="btn gold small" href="${PLANS_URL}" target="_blank" rel="noopener" style="margin-top:14px; display:inline-block;">Join Premium &rarr;</a>
      </div>
    </div>
  `;
}

function conceptCardsHtml() {
  const cards = CONCEPT_CARDS.map((c, i) => {
    const flipped = !!state.flippedConcepts[i];
    return `<div class="concept-flip-scene">
      <div class="concept-flip-card ${flipped ? "flipped" : ""}" onclick="flipConcept(${i})">
        <div class="concept-face concept-front">
          <div style="font-size:22px;">\u2726</div>
          <div class="concept-term">${c.term}</div>
          <div class="tap-hint">tap to reveal</div>
        </div>
        <div class="concept-face concept-back">
          <div class="concept-pain">${c.pain}</div>
          <div class="concept-desc">${c.desc}</div>
          <a href="${c.url}" target="_blank" rel="noopener" class="concept-link" onclick="event.stopPropagation()">Learn This In ${c.course} &rarr;</a>
        </div>
      </div>
    </div>`;
  }).join("");
  return `<div class="concept-grid">${cards}</div>`;
}


/* ---------- EXPLORE MORE ---------- */

function exploreHtml() {
  const items = EXPLORE_ARTIFACTS.map(t => {
    const badge = t.tier === "premium" ? `<span class="tier-badge premium">PREMIUM</span>` : `<span class="tier-badge standard">STANDARD</span>`;
    return `<a href="${t.url}" target="_blank" rel="noopener" class="taste-item" style="text-decoration:none;">
      <div class="taste-icon">${t.icon}</div>
      <div><div class="t">${t.title} ${badge}</div><div class="s">${t.subtitle}</div></div>
    </a>`;
  }).join("");
  return `
    <h2>\u2728 Explore More Healing Tools</h2>
    <p>This companion is just one small piece of what's waiting for you inside. Here's a taste of the other interactive tools and artifacts living in the Academy right now.</p>
    ${items}
    <div class="btn-row" style="justify-content:center;">
      <a class="btn gold" href="${UNION_URL}" target="_blank" rel="noopener">Explore Everything Inside &rarr;</a>
    </div>
  `;
}

/* ---------- ROUTER ---------- */

function render() {
  saveState();
  if (state.screen === "name") { renderName(); return; }
  let content = "";
  if (state.activeTab === "reflect") content = reflectHtml();
  else if (state.activeTab === "ground") content = groundHtml();
  else if (state.activeTab === "tracker") content = trackerHtml();
  else if (state.activeTab === "cardpull") content = cardPullHtml();
  else if (state.activeTab === "journal") content = journalOverviewHtml();
  else if (state.activeTab === "foundations") content = foundationsHtml();
  else if (state.activeTab === "manifest") content = manifestHtml();
  else if (state.activeTab === "explore") content = exploreHtml();
  else if (state.activeTab === "union") content = unionHtml();

  document.getElementById("app").innerHTML = `${topNav()}${content}${footer()}`;
}

loadState();
render();
</script>
