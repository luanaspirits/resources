<script>
(function initSparkles() {
  const wrap = document.getElementById("sparkles");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    const size = 2 + Math.random() * 4;
    s.style.width = size + "px"; s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 4.5) + "s";
    wrap.appendChild(s);
  }
  const glyphs = ["\u2727", "\u2726", "\u263D", "\u2729", "\u2734"];
  for (let i = 0; i < 10; i++) {
    const g = document.createElement("div");
    g.className = "glyph-spark";
    g.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    g.style.fontSize = (10 + Math.random() * 14) + "px";
    g.style.left = Math.random() * 100 + "%"; g.style.top = Math.random() * 100 + "%";
    g.style.animationDelay = (Math.random() * 5) + "s";
    g.style.color = Math.random() > 0.5 ? "var(--gold-soft)" : "var(--periwinkle)";
    wrap.appendChild(g);
  }
})();

let breathTimer = null;
const BOX_PHASES = ["Breathe in...", "Hold...", "Breathe out...", "Hold..."];

function groundHtml() {
  if (state.selfDone) return groundCompleteHtml();
  const step = SELF_STEPS[state.selfStep];

  return `

    <div class="step-dots">${dots}</div>
    <h2>${step.letter} \u2014 ${step.word}</h2>
    <p>${step.body}</p>
    ${step.breathe ? `
      <div class="breathe-wrap">
        <div class="breathe-ball" id="breatheBall"></div>
        <div class="breathe-label" id="breatheLabel">Press start when you're ready</div>
        <button class="btn ghost small" id="breatheBtn" onclick="toggleBreathing()">Start Breathing</button>
      </div>
    ` : ""}
    <div class="card">
      <div class="journal-q">${step.prompt}</div>
      <textarea id="selfField">${state.selfAnswers[state.selfStep] || ""}</textarea>
    </div>
    <div class="btn-row">
      ${state.selfStep > 0 ? `<button class="btn ghost" onclick="selfNav(-1)">&larr; Back</button>` : ""}
      <button class="btn gold" onclick="${isLast ? "finishSelf()" : "selfNav(1)"}">${isLast ? "Finish" : "Continue"} &rarr;</button>
    </div>
  `;
}

function selfNav(dir) {
  state.selfAnswers[state.selfStep] = document.getElementById("selfField").value;
  go({ selfStep: state.selfStep + dir });
}

function finishSelf() {
  state.selfAnswers[state.selfStep] = document.getElementById("selfField").value;
  go({ selfDone: true });
}

function toggleBreathing() {
  const ball = document.getElementById("breatheBall");
  const label = document.getElementById("breatheLabel");
  const btn = document.getElementById("breatheBtn");
  if (state.breathing) {
    state.breathing = false; clearTimeout(breathTimer);
    ball.style.transform = "scale(1)"; label.textContent = "Press start when you're ready"; btn.textContent = "Start Breathing";
    return;
  }
  state.breathing = true; btn.textContent = "Stop";
  let phase = 0;
  const runPhase = () => {
    if (!state.breathing) return;
    label.textContent = BOX_PHASES[phase];
    ball.style.transition = "transform 4s ease-in-out";
    if (phase === 0) ball.style.transform = "scale(1.35)";
    else if (phase === 2) ball.style.transform = "scale(1)";
    phase = (phase + 1) % 4;
    breathTimer = setTimeout(runPhase, 4000);
  };
  runPhase();
}

  return `

function trackerHtml() {
  const n = state.trackerDay;
  const day = TRACKER_DAYS[n];
  const isFirst = n === 0;
  const isLast = n === TRACKER_DAYS.length - 1;
  const dayDone = (i) => {
    const ans = state.trackerAnswers[i];
    return ans && day.prompts.every((p, pi) => ans[pi] && ans[pi].trim());
  };
  const doneCount = TRACKER_DAYS.filter((d, i) => dayDone(i)).length;

  const pills = TRACKER_DAYS.map((d, i) => {
    const done = dayDone(i);
    return `<div class="day-pill ${n === i ? "active" : ""} ${done ? "done" : ""}" onclick="go({trackerDay:${i}})">${i + 1}</div>`;
  }).join("");

  const existing = state.trackerAnswers[n] || {};
  const promptFields = day.prompts.map((p, i) => `
    <div class="journal-q" style="margin-top:${i > 0 ? "16px" : "8px"};">${p}</div>
    <textarea id="trackerField-${i}">${existing[i] || ""}</textarea>
  `).join("");

  return `
    <h2>\u2728 Your 7-Day Union Self Journal</h2>
    <p>Consistency is the whole practice. A few minutes a day, each one guiding you a little closer to connecting with your union self, the version of you already living in alignment.</p>
    <div class="progress-label">${doneCount} of 7 days complete</div>
    <div class="day-pills-row">${pills}</div>
    <div class="card">
      <div class="day-badge">DAY ${n + 1} OF 7, ${day.title.toUpperCase()}</div>
      ${promptFields}
      <button class="btn gold small" onclick="saveTrackerDay()">${dayDone(n) ? "\u2726 Update" : "Save Today's Entry"}</button>
    </div>
    <div class="btn-row">
      ${!isFirst ? `<button class="btn ghost small" onclick="trackerNav(-1)">&larr; Day ${n}</button>` : `<span></span>`}
      ${!isLast ? `<button class="btn ghost small" onclick="trackerNav(1)">Day ${n + 2} &rarr;</button>` : `<button class="btn gold small" onclick="go({activeTab:'union'})">Continue Your Pathway &rarr;</button>`}
    </div>
  `;
}

function collectTrackerAnswers(dayIndex) {
  const day = TRACKER_DAYS[dayIndex];
  const answers = { ...(state.trackerAnswers[dayIndex] || {}) };
  day.prompts.forEach((p, i) => {
    const el = document.getElementById("trackerField-" + i);
    if (el) answers[i] = el.value;
  });
  return answers;
}

function saveTrackerDay() {
  state.trackerAnswers[state.trackerDay] = collectTrackerAnswers(state.trackerDay);
  render();
}

function trackerNav(dir) {
  state.trackerAnswers[state.trackerDay] = collectTrackerAnswers(state.trackerDay);
  go({ trackerDay: state.trackerDay + dir });
}

  `;
}

function answerTierQuiz(weight) {
  const answers = [...state.tierQuizAnswers, weight];
  if (state.tierQuizStep < TIER_QUIZ.length - 1) {
    go({ tierQuizAnswers: answers, tierQuizStep: state.tierQuizStep + 1 });
  } else {
    const total = answers.reduce((a, b) => a + b, 0);
    const result = total >= 2 ? "premium" : "standard";
    go({ tierQuizAnswers: answers, tierQuizResult: result });
  }
}

function resetTierQuiz() {
  go({ tierQuizStep: 0, tierQuizAnswers: [], tierQuizResult: null });
}

function plansHtml() {
  return `
    <div class="tier-compare">
      <div class="tier-col">
        <div class="tier-col-title standard">Standard</div>
        <div class="tier-col-price">${PLANS.standard.price}<br><span>${PLANS.standard.trial}</span></div>
        <ul>${PLANS.standard.features.map(f => `<li>${f}</li>`).join("")}</ul>
        <a class="btn gold small" href="${PLANS_URL}" target="_blank" rel="noopener" style="margin-top:14px; display:inline-block;">Join Standard &rarr;</a>
      </div>
      <div class="tier-col premium">
        <div class="tier-col-title premium">Premium</div>
        <div class="tier-col-price">${PLANS.premium.price}<br><span>${PLANS.premium.trial}</span></div>
        <ul>${PLANS.premium.features.map(f => `<li>${f}</li>`).join("")}</ul>
        <a class="btn gold small" href="${PLANS_URL}" target="_blank" rel="noopener" style="margin-top:14px; display:inline-block;">Join Premium &rarr;</a>
      </div>
    </div>
  `;
}

function conceptCardsHtml() {
  const cards = CONCEPT_CARDS.map((c, i) => {
    const flipped = !!state.flippedConcepts[i];
    return `<div class="concept-flip-scene">
      <div class="concept-flip-card ${flipped ? "flipped" : ""}" onclick="flipConcept(${i})">
        <div class="concept-face concept-front">
          <div style="font-size:22px;">\u2726</div>
          <div class="concept-term">${c.term}</div>
          <div class="tap-hint">tap to reveal</div>
        </div>
        <div class="concept-face concept-back">
          <div class="concept-pain">${c.pain}</div>
          <div class="concept-desc">${c.desc}</div>
          <a href="${c.url}" target="_blank" rel="noopener" class="concept-link" onclick="event.stopPropagation()">Learn This In ${c.course} &rarr;</a>
        </div>
      </div>
    </div>`;
  }).join("");
  return `<div class="concept-grid">${cards}</div>`;
}


/* ---------- EXPLORE MORE ---------- */

function exploreHtml() {
  const items = EXPLORE_ARTIFACTS.map(t => {
    const badge = t.tier === "premium" ? `<span class="tier-badge premium">PREMIUM</span>` : `<span class="tier-badge standard">STANDARD</span>`;
    return `<a href="${t.url}" target="_blank" rel="noopener" class="taste-item" style="text-decoration:none;">
      <div class="taste-icon">${t.icon}</div>
      <div><div class="t">${t.title} ${badge}</div><div class="s">${t.subtitle}</div></div>
    </a>`;
  }).join("");
  return `
    <h2>\u2728 Explore More Healing Tools</h2>
    <p>This companion is just one small piece of what's waiting for you inside. Here's a taste of the other interactive tools and artifacts living in the Academy right now.</p>
    ${items}
    <div class="btn-row" style="justify-content:center;">
      <a class="btn gold" href="${UNION_URL}" target="_blank" rel="noopener">Explore Everything Inside &rarr;</a>
    </div>
  `;
}

/* ---------- ROUTER ---------- */

function render() {
  saveState();
  if (state.screen === "name") { renderName(); return; }
  let content = "";
  if (state.activeTab === "reflect") content = reflectHtml();
  else if (state.activeTab === "ground") content = groundHtml();
  else if (state.activeTab === "tracker") content = trackerHtml();
  else if (state.activeTab === "foundations") content = foundationsHtml();
  else if (state.activeTab === "manifest") content = manifestHtml();
  else if (state.activeTab === "explore") content = exploreHtml();
  else if (state.activeTab === "union") content = unionHtml();

  document.getElementById("app").innerHTML = `${topNav()}${content}${footer()}`;
}

loadState();
render();
</script>
</body>
</html>
