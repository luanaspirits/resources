    </div>
    <p>Spiritual maturity here means holding both possibilities honestly, and getting curious rather than immediately certain.</p>
    <div class="btn-row"><button class="btn gold" onclick="go({activeTab:'clair'})">Find Your Dominant Clair &rarr;</button></div>
  `;
}

/* ---------- CLAIR QUIZ ---------- */

function clairHtml() {
  if (state.quizResult) {
    const r = CLAIR_RESULTS[state.quizResult];
    return `
      <h2 class="center">Your Result</h2>
      <div class="card ritual center">
        <div class="result-icon">\u2728</div>
        <h3>${r.name}</h3>
        <p style="margin-bottom:0;">${r.desc}</p>
      </div>
      <div class="btn-row">
        <button class="btn ghost small" onclick="resetQuiz()">Retake Quiz</button>
        <button class="btn gold small" onclick="go({activeTab:'decode'})">Try The Decode Practice &rarr;</button>
      </div>
    `;
  }
  const q = CLAIR_QUIZ[state.quizStep];
  const dots = CLAIR_QUIZ.map((s, i) => `<div class="quiz-dot ${i === state.quizStep ? "active" : i < state.quizStep ? "done" : ""}"></div>`).join("");
  return `
    <h2>\u2728 Which Clair Do You Receive Signs Through?</h2>
    <p>Signs can come through any of your clairs, it depends entirely on you. This is the same framework taught in Become Your Own Psychic, applied here specifically to signs.</p>
    <div class="quiz-progress">QUESTION ${state.quizStep + 1} OF ${CLAIR_QUIZ.length}</div>
    <div class="quiz-dots">${dots}</div>
    <div class="card">
      <h3>${q.q}</h3>
      ${q.options.map(o => `<div class="choice" onclick="answerQuiz('${o.type}')">${o.label}</div>`).join("")}
    </div>
  `;
}

function answerQuiz(type) {
  const answers = [...state.quizAnswers, type];
  if (state.quizStep < CLAIR_QUIZ.length - 1) {
    go({ quizAnswers: answers, quizStep: state.quizStep + 1 });
  } else {
    const tally = {};
    answers.forEach(a => { tally[a] = (tally[a] || 0) + 1; });
    const result = Object.keys(tally).reduce((a, b) => tally[a] >= tally[b] ? a : b);
    go({ quizAnswers: answers, quizResult: result });
  }
}

function resetQuiz() {
  go({ quizStep: 0, quizAnswers: [], quizResult: null });
}

/* ---------- DECODE PRACTICE ---------- */

function decodeHtml() {
  const step = DECODE_STEPS[state.decodeStep];
  const isLast = state.decodeStep === DECODE_STEPS.length - 1;
  const dots = DECODE_STEPS.map((s, i) => `<div class="step-dot ${i === state.decodeStep ? "active" : i < state.decodeStep ? "done" : ""}"></div>`).join("");
  return `
    <h2>\u{1F338} The Decode Practice</h2>
    <p>This is the exact process I walk clients through. Keep an intuition journal, this saves that journal for you automatically.</p>
    <div class="step-progress">STEP ${state.decodeStep + 1} OF ${DECODE_STEPS.length}</div>
    <div class="step-dots">${dots}</div>
    <div class="card">
      <h3>${step.title}</h3>
      <p>${step.prompt}</p>
      <textarea id="decodeField">${state.decodeAnswers[state.decodeStep] || ""}</textarea>
    </div>
    <div class="btn-row">
      ${state.decodeStep > 0 ? `<button class="btn ghost" onclick="decodeNav(-1)">&larr; Back</button>` : ""}
      ${isLast ? `<button class="btn gold" onclick="finishDecode()">Save This Sign</button>` : `<button class="btn gold" onclick="decodeNav(1)">Continue &rarr;</button>`}
    </div>
    ${!isLast && state.decodeStep === 3 ? `<p style="margin-top:12px; font-size:12.5px;"><em class="hl">You can research this symbol afterward if it feels relevant, but your own felt sense is the actual message, research only ever supports it.</em></p>` : ""}
    ${decodeHistoryHtml()}
  `;
}

function decodeNav(dir) {
  state.decodeAnswers[state.decodeStep] = document.getElementById("decodeField").value;
  go({ decodeStep: state.decodeStep + dir });
}

function finishDecode() {
  state.decodeAnswers[state.decodeStep] = document.getElementById("decodeField").value;
  state.savedDecodes.push({ date: new Date().toLocaleDateString(), answers: { ...state.decodeAnswers } });
  go({ decodeStep: 0, decodeAnswers: {}, activeTab: "resources", justSavedDecode: true });
}

function decodeHistoryHtml() {
  if (!state.savedDecodes.length) return "";
  const entries = [...state.savedDecodes].reverse().map(d => `
    <div class="entry">
      <div class="tt">${d.answers[0] || "Untitled sign"}</div>
      <div class="meta">${d.date}</div>
      ${DECODE_STEPS.map((s, i) => i > 0 && d.answers[i] ? `<div class="q">${s.title}</div><div class="a">${d.answers[i]}</div>` : "").join("")}
    </div>
  `).join("");
  return `<div class="section-label">Your Saved Signs</div><div class="card">${entries}</div>`;
}

/* ---------- GO DEEPER ---------- */

function resourcesHtml() {
  const practiceItems = PRACTICE_LINKS.map(l => `<a href="${l.url}" target="_blank" rel="noopener" class="link-item"><div class="link-icon">${l.icon}</div><div><div class="t">${l.title} <span class="tier-tag standard">STANDARD</span></div><div class="s">${l.subtitle}</div></div></a>`).join("");
  const premiumItems = PREMIUM_LINKS.map(l => `<a href="${l.url}" target="_blank" rel="noopener" class="link-item"><div class="link-icon">${l.icon}</div><div><div class="t">${l.title} <span class="tier-tag premium">PREMIUM</span></div><div class="s">${l.subtitle}</div></div></a>`).join("");
  const savedBanner = state.justSavedDecode ? `<div class="save-reminder"><span>\u2728</span><span>Your sign is saved. Keep going whenever you're ready.</span></div>` : "";
  return `
    ${savedBanner}
    <h2>\u2728 Go Deeper</h2>
    <p>You just learned how to read a sign. Here's where the practice actually builds, at whatever pace fits you.</p>
    <div class="section-label">Practice What You Just Learned</div>
    ${practiceItems}
    <div class="section-label">Ready For The Heavier-Duty Next Step?</div>
    <a href="${PSYCHIC_LINK.url}" target="_blank" rel="noopener" class="link-item"><div class="link-icon">${PSYCHIC_LINK.icon}</div><div><div class="t">${PSYCHIC_LINK.title} <span class="tier-tag premium">PREMIUM</span></div><div class="s">${PSYCHIC_LINK.subtitle}</div></div></a>
    <div class="section-label">If You Want To Go Even Deeper</div>
    ${premiumItems}
    <div class="tagline">Communicating with the universe well is a skill, not a gift some people have and others don't.</div>
  `;
}

/* ---------- ROUTER ---------- */

function render() {
  saveState();
  let content = "";
  if (state.activeTab === "welcome") content = welcomeHtml();
  else if (state.activeTab === "test") content = testHtml();
  else if (state.activeTab === "discernment") content = discernmentHtml();
  else if (state.activeTab === "clair") content = clairHtml();
  else if (state.activeTab === "decode") content = decodeHtml();
  else if (state.activeTab === "resources") content = resourcesHtml();

  document.getElementById("app").innerHTML = `${topNav()}<div class="fade-in-content">${content}</div>${footer()}`;
}

loadState();
render();
</script>
</body>
</html>
