    `;
  }
  const q = QUIZ[state.quizStep];
  const dots = QUIZ.map((s, i) => `<div class="quiz-dot ${i === state.quizStep ? "active" : i < state.quizStep ? "done" : ""}"></div>`).join("");

function answerQuiz(type) {
  const answers = [...state.quizAnswers, type];
  if (state.quizStep < QUIZ.length - 1) {
    go({ quizAnswers: answers, quizStep: state.quizStep + 1 });
  } else {
    const aligned = answers.filter(a => a === "aligned").length;
    go({ quizAnswers: answers, quizResult: aligned >= 3 ? "aligned" : "catalyst" });
  }
}

function resetQuiz() {
  go({ quizStep: 0, quizAnswers: [], quizResult: null });
}

      <p style="margin-bottom:14px; color:var(--text);">Come find me, I'd love to hear which part of this hit closest to home.</p>
      <div class="btn-row" style="justify-content:center;">
        <a class="btn gold" href="https://skool.com/union" target="_blank" rel="noopener">Join Union &rarr;</a>
        <a class="btn ghost small" href="https://stan.store/luanaspirits" target="_blank" rel="noopener">See My Readings &rarr;</a>

    </div>
    <div class="tagline">You don't have to know for certain right now. Not knowing is allowed to be part of the process.</div>
  `;
}

/* ---------- ROUTER ---------- */

function render() {
  saveState();
  let content = "";
  if (state.activeTab === "welcome") content = welcomeHtml();
  else if (state.activeTab === "definition") content = definitionHtml();
  else if (state.activeTab === "quiz") content = quizHtml();
  else if (state.activeTab === "cycle") content = cycleHtml();
  else if (state.activeTab === "join") content = joinHtml();

  document.getElementById("app").innerHTML = `${topNav()}${content}${footer()}`;
}

loadState();
render();
</script>
