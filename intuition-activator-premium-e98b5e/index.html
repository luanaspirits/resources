<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Intuition Activator, premium member edition. For Luana Spirits community members.">
<meta name="theme-color" content="#1a0a20">
<title>Intuition Activator · Premium · Luana Spirits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #1a0a20; --plum: #2a1233; --plum2: #3d1f47; --plum3: #5b2f6b;
    --violet: #8b5fa8; --lav: #c9b3d9; --gold: #c9a55f; --gold2: #e3c27f;
    --text: #efe4f3; --soft: #bfaec8; --line: rgba(227,194,127,.22); --line2: rgba(227,194,127,.45);
    --card: rgba(255,255,255,.045);
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'DM Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: var(--sans); font-weight: 300; font-size: 17px; line-height: 1.7;
    color: var(--text); background: radial-gradient(ellipse at 20% 0%, #4a2458 0%, var(--plum) 40%, var(--bg) 100%) fixed var(--bg);
    min-height: 100vh; overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: tw 4s infinite ease-in-out; }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
  @media (prefers-reduced-motion: reduce) { .star, .breath.run { animation: none !important; } }

  b, strong { font-weight: 500; color: var(--gold2); }
  em { font-family: var(--serif); font-style: italic; }
  a { color: var(--gold2); }
  a:focus-visible, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }
  p { margin: 0; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; text-wrap: balance; margin: 0; }
  h2 { font-size: clamp(28px, 5.4vw, 38px); line-height: 1.15; }
  h2 em, h1 em { color: var(--gold2); }
  h3 { font-size: 21px; color: var(--gold2); line-height: 1.3; }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding-inline: 20px; }
  section { padding-block: 40px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--gold2); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .head p { color: var(--soft); }
  .rule { height: 2px; width: 100%; background: linear-gradient(90deg, var(--gold), var(--violet) 60%, transparent); }
  .soft { color: var(--soft); }
  .small { font-size: 15px; }

  /* TOP BAR + APP NAV */
  .topbar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding-block: 18px 6px; }
  .sig { font-family: var(--serif); font-size: 22px; color: var(--gold2); text-decoration: none; }
  .sig em { color: var(--text); }
  .ver { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; padding: 5px 11px; border-radius: 30px; border: 1px solid var(--line2); color: var(--gold2); }
  .appnav { position: relative; z-index: 3; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .appnav::-webkit-scrollbar { display: none; }
  .appnav button { flex-shrink: 0; background: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--soft); padding: 14px 12px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .appnav button.on { color: var(--gold2); border-bottom-color: var(--gold2); }
  .appnav .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold2); margin-left: 6px; vertical-align: 2px; }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--sans); font-weight: 500; font-size: 16px; letter-spacing: .6px; color: #fff; text-decoration: none; background: linear-gradient(135deg, var(--gold), var(--violet)); border-radius: 40px; padding: 15px 30px; border: 0; cursor: pointer; box-shadow: 0 8px 30px rgba(201,165,95,.25); transition: transform .2s, box-shadow .2s; line-height: 1.2; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(201,165,95,.35); }
  .btn.ghost { background: transparent; border: 1px solid var(--gold2); color: var(--gold2); box-shadow: none; }
  .btn.ghost:hover { background: rgba(227,194,127,.1); }
  .btn.sm { font-size: 13px; padding: 9px 16px; letter-spacing: .4px; }
  .btn.quiet { background: transparent; border: 1px solid var(--line); color: var(--soft); box-shadow: none; }
  .cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* HERO */
  .me-hero { position: relative; z-index: 1; padding-block: 20px 10px; overflow: hidden; }
  .me-hero .bgimg { position: absolute; inset: 0; z-index: -1; }
  .me-hero .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 20% 40%; opacity: .3; }
  .me-hero .bgimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,10,32,.15), var(--plum) 96%); }
  .me-grid { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: end; }
  .me-text { display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; order: 2; }
  .me-text h1 { font-size: clamp(44px, 9vw, 74px); line-height: 1.02; }
  .me-text h1 em { display: block; }
  .tagline { font-family: var(--serif); font-style: italic; color: var(--lav); font-size: clamp(18px, 3.4vw, 22px); max-width: 32ch; line-height: 1.45; }
  .me-photo { position: relative; margin: 0 auto; width: min(74%, 360px); order: 1; }
  .me-photo::before { content: ""; position: absolute; left: 50%; top: 42%; width: 118%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(227,194,127,.30) 0%, rgba(139,95,168,.26) 42%, transparent 70%); z-index: -1; }
  .me-photo img { width: 100%; height: auto; display: block; -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent); }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pill { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; padding: 5px 12px; border-radius: 30px; background: var(--plum3); color: var(--gold2); }
  .pill.solid { background: var(--gold2); color: var(--plum); }
  @media (min-width: 720px) {
    .me-grid { grid-template-columns: 1.1fr .9fr; gap: 30px; }
    .me-text { order: 1; text-align: left; align-items: flex-start; padding-bottom: 60px; }
    .me-text .cta-row, .me-text .facts { justify-content: flex-start; }
    .me-photo { order: 2; width: 100%; max-width: 400px; }
  }

  /* THESIS */
  .thesis { font-family: var(--serif); font-size: clamp(26px, 5vw, 36px); line-height: 1.3; text-align: center; color: #fff; max-width: 22ch; margin: 0 auto; text-wrap: balance; }
  .thesis em { color: var(--gold2); }
  .thesis::before, .thesis::after { content: "\2726"; display: block; font-family: var(--sans); font-size: 14px; color: var(--gold2); margin: 12px 0; }

  /* STORY */
  .story { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
  .portrait { position: relative; max-width: 300px; width: 100%; margin: 0 auto; }
  .portrait .arch { border-radius: 200px 200px 18px 18px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(circle at 50% 35%, rgba(227,194,127,.28), var(--plum3) 55%, var(--plum2)); padding-top: 18px; }
  .portrait img { width: 100%; height: auto; display: block; }
  .portrait figcaption { text-align: center; font-family: var(--serif); font-style: italic; color: var(--soft); font-size: 15px; margin-top: 10px; }
  @media (min-width: 720px) { .story { grid-template-columns: 260px 1fr; } }
  .pull { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.45; color: #fff; border-left: 2px solid var(--gold2); padding-left: 18px; }

  /* LISTS */
  ul.marks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  ul.marks li { position: relative; padding-left: 28px; }
  ul.marks li::before { content: "\2726"; position: absolute; left: 0; top: 0; color: var(--gold2); font-size: 14px; line-height: 1.9; }
  ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 22px 56px; min-height: 40px; }
  ol.steps li::before { content: counter(s, upper-roman); position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 15px; color: var(--plum); background: var(--gold2); }
  ol.steps li:not(:last-child)::after { content: ""; position: absolute; left: 18px; top: 42px; bottom: 4px; width: 2px; background: linear-gradient(var(--gold2), var(--violet)); opacity: .5; }
  ol.steps .v { font-family: var(--serif); font-size: 19px; color: #fff; line-height: 1.35; padding-top: 5px; }
  ol.steps .d { color: var(--soft); font-size: 15.5px; }

  /* BOXES */
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .box .t { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold2); }
  .box .v { font-family: var(--serif); font-size: 21px; color: #fff; line-height: 1.3; }
  .box .d { font-size: 15.5px; color: var(--soft); }
  .box.this { background: linear-gradient(160deg, var(--plum2), rgba(91,47,107,.35)); border-color: var(--line2); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .note { border-left: 3px solid var(--violet); background: rgba(139,95,168,.14); padding: 20px 22px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
  .note .t { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--lav); }
  .say { font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.5; color: #fff; border-left: 2px solid var(--gold2); padding-left: 18px; }

  /* VIDEO */
  .video { position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--plum2); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ACCORDION */
  details.acc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  details.acc summary { list-style: none; cursor: pointer; padding: 16px 20px; font-family: var(--serif); font-size: 19px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary .n { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--gold2); margin-right: 12px; }
  details.acc summary::after { content: "+"; color: var(--gold2); font-family: var(--sans); font-size: 22px; font-weight: 300; }
  details.acc[open] summary::after { content: "\2212"; }
  details.acc .body { padding: 0 20px 18px; color: var(--soft); font-size: 16px; display: flex; flex-direction: column; gap: 10px; }
  .swatches { display: flex; flex-direction: column; gap: 10px; }
  .sw { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; font-size: 15.5px; }
  .sw i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line2); }
  .sw b { color: #fff; }

  /* CHOICES */
  .choice { display: block; width: 100%; text-align: left; font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.5; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 18px 15px 48px; margin-bottom: 10px; cursor: pointer; position: relative; transition: border-color .2s, background .2s; }
  .choice::before { content: ""; position: absolute; left: 17px; top: 18px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line2); }
  .choice:hover { border-color: var(--line2); }
  .choice.on { background: linear-gradient(160deg, var(--plum2), rgba(91,47,107,.35)); border-color: var(--gold2); }
  .choice.on::before { background: var(--gold2); box-shadow: inset 0 0 0 3px var(--plum2); }
  .choice small { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
  .choice .v { font-family: var(--serif); font-size: 18px; color: #fff; }
  .result { margin-top: 14px; }

  /* READING FLOW */
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 8px; }
  .stepper .of { font-family: var(--mono); font-size: 11.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold2); }
  .stars9 { display: flex; gap: 6px; }
  .stars9 span { font-size: 11px; color: rgba(227,194,127,.25); }
  .stars9 span.done { color: var(--gold2); }
  label.fl { display: block; font-family: var(--serif); font-size: 18px; color: #fff; margin: 18px 0 6px; line-height: 1.35; }
  label.fl small { display: block; font-family: var(--sans); font-size: 14.5px; color: var(--soft); font-weight: 300; margin-top: 2px; }
  textarea, input[type=text] { width: 100%; background: rgba(26,10,32,.55); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-family: var(--sans); font-size: 16px; font-weight: 300; padding: 13px 15px; line-height: 1.55; transition: border-color .2s; }
  textarea { min-height: 88px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--gold2); }
  ::placeholder { color: #8f7a9a; }
  .orient { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .orient button { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 13px; border-radius: 30px; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; }
  .orient button.on { background: var(--gold2); color: var(--plum); border-color: var(--gold2); }
  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 28px; }

  /* TAROT CARD FRAME */
  .tcard { position: relative; background: linear-gradient(170deg, var(--plum2), rgba(42,18,51,.9)); border: 1px solid var(--line2); border-radius: 18px; padding: 26px 22px 22px; margin-bottom: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .tcard::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(227,194,127,.16); border-radius: 12px; pointer-events: none; }
  .tcard > * { position: relative; }
  .tcard .roman { text-align: center; font-family: var(--serif); font-size: 15px; letter-spacing: 3px; color: var(--gold2); }
  .tcard .cname { text-align: center; font-family: var(--serif); font-style: italic; font-size: 24px; color: #fff; line-height: 1.25; margin-top: 2px; }
  .tcard .cpos { text-align: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--lav); margin-top: 6px; }
  .tcard .divider { text-align: center; color: var(--gold2); font-size: 11px; letter-spacing: 8px; margin: 12px 0 2px; opacity: .8; }
  .tcard .hint { text-align: center; color: var(--soft); font-size: 15px; font-family: var(--serif); font-style: italic; margin-top: 8px; }
  .tcard .rm { position: absolute; top: 14px; right: 16px; background: none; border: 0; color: var(--soft); font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; }
  .mine { background: rgba(26,10,32,.45); border: 1px dashed var(--line2); border-radius: 12px; padding: 14px 16px; margin-top: 14px; font-size: 15.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .mine .t { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold2); display: block; margin-bottom: 4px; white-space: normal; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 2px; }

  /* BREATH */
  .breath-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
  .breath { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(227,194,127,.45) 0%, rgba(139,95,168,.32) 45%, transparent 70%); transform: scale(.7); }
  .breath.run { animation: breathe 10s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(.7); } 45%,55% { transform: scale(1.06); } }
  .breath span { font-family: var(--serif); font-style: italic; font-size: 18px; color: #fff; }
  .timer { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--soft); }

  /* JOURNAL */
  .j { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; }
  .j .date { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold2); }
  .j .q { font-family: var(--serif); font-size: 20px; color: #fff; line-height: 1.3; margin: 4px 0 6px; }
  .j .cards { font-size: 15px; color: var(--lav); }
  .j .take { font-family: var(--serif); font-style: italic; color: var(--text); margin-top: 10px; border-left: 2px solid var(--gold2); padding-left: 14px; }
  .j .full { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--soft); white-space: pre-wrap; }
  .j .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  /* RESOURCES */
  .rc { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; text-decoration: none; color: var(--text); transition: border-color .2s; }
  .rc:hover { border-color: var(--line2); }
  .rc .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--plum3); color: var(--gold2); font-size: 18px; }
  .rc .v { font-family: var(--serif); font-size: 19px; color: #fff; line-height: 1.3; }
  .rc .d { font-size: 14.5px; color: var(--soft); }
  .rc .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--gold2); margin-left: 6px; vertical-align: 2px; }

  /* FINAL */
  .final { position: relative; text-align: center; border-radius: 24px; overflow: hidden; border: 1px solid var(--line); }
  .final img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38; }
  .final .inner { position: relative; padding: 52px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: linear-gradient(180deg, rgba(26,10,32,.3), rgba(26,10,32,.78)); }
  .final h2 { max-width: 18ch; }
  .final .sign { font-family: var(--serif); font-style: italic; color: var(--lav); font-size: 19px; }

  footer { position: relative; z-index: 1; text-align: center; padding-block: 40px 70px; color: var(--soft); font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  footer .sig { font-size: 26px; }
  footer a { color: var(--soft); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold2); color: var(--plum); font-weight: 500; font-size: 14px; padding: 10px 20px; border-radius: 40px; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* FUNNEL */
  .btn.xl { font-size: 18px; padding: 19px 38px; letter-spacing: .8px; }
  .btn.block { width: 100%; }
  .btn .sub { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; opacity: .85; font-weight: 400; margin-top: 3px; text-transform: uppercase; }
  .btn.stack2 { flex-direction: column; gap: 0; }
  .trust { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .trust div { text-align: center; padding: 16px 6px; display: flex; flex-direction: column; gap: 2px; }
  .trust div + div { border-left: 1px solid var(--line); }
  .trust b { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--gold2); line-height: 1.1; }
  .trust span { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--soft); }
  @media (max-width: 560px) { .trust { grid-template-columns: repeat(2, 1fr); } .trust div:nth-child(3) { border-left: 0; } .trust div:nth-child(n+3) { border-top: 1px solid var(--line); } }
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; margin: 0; }
  .q .stars { color: var(--gold2); letter-spacing: 3px; font-size: 14px; }
  .q p { font-family: var(--serif); font-style: italic; font-size: 17.5px; line-height: 1.55; color: #fff; }
  .q cite { font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold2); }
  .bookcard { position: relative; overflow: hidden; border-radius: 22px; border: 1px solid var(--line2); background: linear-gradient(150deg, rgba(201,165,95,.20), rgba(139,95,168,.22) 55%, rgba(42,18,51,.6)); padding: 32px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 34px 0 6px; }
  .bookcard::before { content: "\2726"; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); color: var(--gold2); font-size: 12px; opacity: .8; }
  .bookcard h3 { font-size: clamp(24px, 4.6vw, 30px); color: #fff; font-weight: 500; max-width: 20ch; margin-top: 6px; }
  .bookcard h3 em { color: var(--gold2); }
  .bookcard p { color: var(--text); max-width: 46ch; }
  .bookcard .mini { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--lav); }
  .bookbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(26,10,32,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line2); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .35s ease; }
  .bookbar.show { transform: none; }
  .bookbar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bookbar .msg { font-family: var(--serif); font-style: italic; color: var(--text); font-size: 15.5px; line-height: 1.3; }
  .bookbar .msg small { display: block; font-family: var(--mono); font-style: normal; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold2); margin-top: 2px; }
  .bookbar .btn { padding: 12px 22px; font-size: 15px; flex-shrink: 0; }
  body { padding-bottom: 0; }
  .signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .sign-i { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 15.5px; }
  .sign-i i { font-style: normal; color: var(--gold2); font-size: 18px; line-height: 1.4; text-align: center; }
  .stepcta { margin-top: 26px; padding: 16px 18px; border-radius: 14px; border: 1px dashed var(--line2); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .stepcta p { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--text); flex: 1 1 220px; }

  @media (max-width: 480px) {
    body { font-size: 16.5px; }
    .tcard { padding: 24px 16px 18px; }
    .btn { padding: 14px 24px; }
    .navrow .btn { padding: 13px 20px; }
    .btn.xl { font-size: 17px; padding: 17px 28px; }
    .bookbar .msg { font-size: 14px; }
    .bookbar .btn { padding: 11px 18px; font-size: 14px; }
  }
</style>

  acc("I", "Midway cards: when a card falls sideways", '<p>Upright means the energy is present. Reversed means it\'s blocked, or being healed. Sideways is the midway: the energy is forming, but there\'s a nuance that doesn\'t fit upright or reversed.</p><p><strong>Example: Knight of Swords.</strong> Upright, someone who loves to pick a fight, gossip, drama. Reversed, someone actively trying to heal that. Midway, someone who isn\'t fully aware of the effect they\'re having, or who had this energy in the past. Cut them some slack.</p><p><strong>Example: Nine of Pentacles.</strong> Midway can mean you\'re building strong stability and self-worth, but hesitating somewhere. Look at the cards around it to find where.</p><p>A card only comes out if you\'re already resonating with its energy. So a midway card is often a confirmation that the energy is forming. It just needs a gentle nudge.</p>') +

  acc("IV", "Read one card from many angles", '<p>The same card can carry several layers. Read it once for the big picture, like your love journey. Then read it again purely for today: <em>"How does this reflect my energy right now? What message helps me today?"</em></p><p>Readings are like peeling an onion, or rewatching a movie. Every time you look, you see something new.</p>') +
  acc("V", "Ask the card for advice in third person", '<p>If a reversed card confuses you, step outside yourself. Ask: <em>"If the Queen of Wands needed advice to get upright again, what would she need to hear?"</em></p><p>Then answer without thinking. It might feel a little weird to talk about yourself in third person. It works because it lifts you into a higher, more objective perspective.</p>') +
  acc("VI", "One piece of information, then extend it", '<p>Sometimes you get one word or one feeling, then your mind goes blank. That\'s okay. Receive the piece, then let your logical mind extend it.</p><p>When I was drawn to the word <strong>skill</strong> on the Magician, I asked: okay, what skills am I not giving myself credit for? Then I listed them. That list was the message.</p><p>When your mind goes blank again, just sit with the energy and see what else comes through.</p>') +

function sw(c, n, t) { return '<div class="sw"><i style="background:' + c + '"></i><div><b>' + n + '</b> · ' + t + '</div></div>'; }
function suit(el, k, t) { return '<div class="box"><div class="t">' + el + '</div><div class="v">' + k + '</div><div class="d">' + t + '</div></div>'; }
function toggleClair(i) { var a = state.clairs, x = a.indexOf(i); if (x > -1) a.splice(x, 1); else a.push(i); saveState(); render(); }

/* ================= READING FLOW ================= */
var STEPS = ["Ground", "Protect", "Ask", "Shuffle", "Pull", "Feel", "Story", "Look it up", "Close"];
function startReading() { if (!inProgress()) { state.reading = blankReading(); state.step = 0; } saveState(); go("read"); }
function newReading() {
  if (!confirm("Start a fresh reading? Anything you haven't saved to your journal will be cleared.")) return;
  state.reading = blankReading(); state.step = 0; saveState(); render(); window.scrollTo({ top: 0 });
}
function stepTo(n) {
  if (n === 4 && state.step === 3 && !state.reading.spread) { toast("Choose a spread first"); return; }
  if (n === 5 && !state.reading.cards.some(function(c){ return c.name.trim(); })) { toast("Name at least one card first"); return; }
  stopBreath(); state.step = Math.max(0, Math.min(STEPS.length - 1, n)); saveState(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function navrow(back, next) {
  return '<div class="navrow">' + (back ? '<button class="btn quiet" onclick="stepTo(' + (state.step - 1) + ')">Back</button>' : '<span></span>') +
    '<button class="btn" onclick="stepTo(' + (state.step + 1) + ')">' + (next || "Next") + '</button></div>';
}
function readTab() {
  var s = state.step;
  var head = '<div class="stepper"><span class="of">Step ' + ROMAN[s] + ' of IX · ' + STEPS[s] + '</span><span class="stars9" aria-hidden="true">' +
    STEPS.map(function(_, i){ return '<span class="' + (i <= s ? "done" : "") + '">✦</span>'; }).join("") + '</span></div><div class="rule" style="margin-bottom:24px"></div>';
  var body = [stepGround, stepProtect, stepAsk, stepShuffle, stepPull, stepFeel, stepStory, stepLookup, stepClose][s]();
  return '<main class="wrap">' + head + body +
    '<div class="cta-row" style="margin-top:34px"><button class="btn quiet sm" onclick="newReading()">Start over with a new reading</button></div></main>';
}
function title(h, sub) { return '<div class="head"><h2>' + h + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>'; }

/* I ground */
var breathTimer = null;
function stepGround() {
  return title("Ground your <em>energy.</em>", "A calm nervous system makes intuitive information so much easier to receive. Even as a professional, it takes me a moment to drop into reading space. Once I\'m there, it flows.") +
  '<div class="box this" style="align-items:center"><div class="breath-wrap"><div class="breath" id="breath"><span id="breathTxt">ready</span></div><div class="timer" id="breathTimer">1:00</div>' +
    '<button class="btn ghost sm" id="breathBtn" onclick="toggleBreath()">Start one minute of breathing</button></div></div>' +
  '<section style="padding-bottom:0"><ul class="marks">' +
    '<li>Get comfortable. Lean back, or even lie down.</li>' +
    '<li>Breathe in, then exhale out loud. Let the tension run out.</li>' +
    '<li>Notice where you\'re holding tension and breathe into it. Yawning is a good sign.</li>' +
    '<li>Feel gravity anchoring you into your body. Imagine roots running into the earth.</li>' +
    '<li>Put a hand on your heart. This is your center of intuition.</li>' +
  '</ul></section>' +
  '<p class="say" style="margin-top:24px">I don\'t need a big vision today. It\'s okay if my intuition just whispers.</p>' +
  navrow(false, "I feel grounded");
}
function toggleBreath() {
  if (breathTimer) { stopBreath(); return; }
  var b = document.getElementById("breath"); if (b) b.classList.add("run");
  document.getElementById("breathBtn").textContent = "Stop";
  var t0 = Date.now();
  breathTimer = setInterval(function(){
    var el = (Date.now() - t0) / 1000, left = Math.max(0, 60 - Math.floor(el));
    var txt = document.getElementById("breathTxt"), tm = document.getElementById("breathTimer");
    if (!txt) { stopBreath(); return; }
    txt.textContent = (el % 10) < 5 ? "breathe in" : "breathe out";
    tm.textContent = "0:" + (left < 10 ? "0" : "") + left;
    if (left <= 0) { stopBreath(); txt.textContent = "beautiful"; tm.textContent = "DONE"; }
  }, 250);
}
function stopBreath() {
  if (breathTimer) clearInterval(breathTimer); breathTimer = null;
  var b = document.getElementById("breath"); if (b) b.classList.remove("run");
  var btn = document.getElementById("breathBtn"); if (btn) btn.textContent = "Start one minute of breathing";
}

/* II protect */
function stepProtect() {
  return title("Protect your energy and <em>set your intention.</em>", "Before every reading, say an intention out loud. It creates an energetic boundary for your session. Edit it so it sounds like you.") +
  '<textarea aria-label="Your intention" oninput="setR(\'intention\', this.value)" style="min-height:120px">' + esc(state.reading.intention) + '</textarea>' +
  '<section style="padding-bottom:0"><div class="head"><div class="eyebrow">You can also say</div></div><div class="stack">' +
    '<p class="say">Spirit guides, spirit team, angels and loved ones, please be with me. Archangel Michael, please protect my energy during this reading.</p>' +
    '<p class="say">Please help me tell my own fears apart from the truth.</p>' +
    '<p class="say">Only loving, high vibrational energies are welcome here.</p></div></section>' +
  '<section style="padding-bottom:0"><div class="note"><div class="t">Clear the canvas</div><p>Imagine a huge blank canvas in your heart. Ask, <em>"Please help me clear my energy so I can read from a neutral space."</em> Picture the crown of your head opening and a stream of intuition flowing in, landing softly in your heart.</p></div></section>' +
  navrow(true, "I\'ve said my intention");
}

/* III ask */
function stepAsk() {
  var r = state.reading, custom = r.question && !QUESTIONS.some(function(x){ return x.q === r.question; });
  return title("Ask your <em>question.</em>", "Pick one, or write your own. Open questions work best: what, show me, tell me about.") +
  QUESTIONS.map(function(x, i){ return '<button class="choice' + (r.question === x.q ? " on" : "") + '" onclick="pickQ(' + i + ')"><span class="v">' + x.q + '</span><small>' + x.note + '</small></button>'; }).join("") +
  '<label class="fl">Or write your own<small>Be specific. Tell your guides exactly what kind of guidance you want.</small></label>' +
  '<input type="text" value="' + esc(custom ? r.question : "") + '" placeholder="What do I need to know about my love life right now?" oninput="setR(\'question\', this.value)">' +
  '<p class="soft small" style="margin-top:16px">Once you have it, ask it in your heart. Let it sit for a moment. Don\'t think too much about it.</p>' +
  navrow(true);
}
function pickQ(i) { state.reading.question = QUESTIONS[i].q; saveState(); render(); }

/* IV shuffle */
function stepShuffle() {
  var r = state.reading;
  return title("Shuffle and <em>choose your spread.</em>", "Hold your deck. Notice how the cards feel in your hands. Then shuffle however you know how.") +
  '<div class="grid2">' +
    '<div class="box"><div class="t">Overhand</div><div class="d">Great for letting cards jump out at you.</div></div>' +
    '<div class="box"><div class="t">Casino</div><div class="d">On the table. Good when you have a set spread.</div></div>' +
    '<div class="box"><div class="t">Can\'t shuffle yet?</div><div class="d">Spread them face down and swirl them around. I couldn\'t shuffle when I started either.</div></div>' +
  '</div>' +
  '<p class="soft" style="margin:20px 0 10px">As you shuffle, imagine a violet flame cleansing the cards, and repeat your question:</p>' +
  '<p class="say">' + esc(r.question || "Your question") + '</p>' +
  '<section style="padding-bottom:0"><div class="head"><div class="eyebrow">Choose your spread</div></div>' +
  Object.keys(SPREADS).map(function(k){ var sp = SPREADS[k]; return '<button class="choice' + (r.spread === k ? " on" : "") + '" onclick="pickSpread(\'' + k + '\')"><span class="v">' + sp.name + '</span><small>' + sp.sub + '</small></button>'; }).join("") +
  '<p class="soft small" style="margin-top:12px">Fan the cards out in a line or a rainbow and pick the ones you\'re drawn to, or take them from the top. Any card that falls out counts.</p></section>' +
  navrow(true, "I\'ve pulled my cards");
}
function pickSpread(k) {
  var r = state.reading, n = SPREADS[k].pos.length; r.spread = k;
  while (r.cards.length < n) r.cards.push(blankCard());
  if (r.cards.length > n && !r.cards.slice(n).some(function(c){ return c.name; })) r.cards = r.cards.slice(0, n);
  saveState(); render();
}

/* V pull */
function stepPull() {
  var r = state.reading; if (!r.cards.length) r.cards.push(blankCard());
  return title("Lay out <em>your cards.</em>", "Turn them over, left to right. Type each card\'s name (it will suggest as you type) and tap how it came out.") +
  '<datalist id="cardnames">' + ALL_CARDS.map(function(c){ return '<option value="' + c + '">'; }).join("") + '</datalist>' +
  r.cards.map(function(c, i){
    return '<div class="tcard">' + (r.cards.length > 1 ? '<button class="rm" onclick="removeCard(' + i + ')">Remove</button>' : '') +
      '<div class="roman">' + ROMAN[i] + '</div><div class="cpos">' + esc(posOf(r, i)) + '</div><div class="divider">✦ ✦ ✦</div>' +
      '<input type="text" list="cardnames" aria-label="Card ' + (i + 1) + ' name" value="' + esc(c.name) + '" placeholder="Queen of Cups, or your oracle card" oninput="setC(' + i + ',\'name\', this.value)" style="margin-top:12px;text-align:center">' +
      '<div class="orient" style="justify-content:center">' + ["upright","reversed","sideways"].map(function(o){ return '<button class="' + (c.orient === o ? "on" : "") + '" onclick="setOrient(' + i + ',\'' + o + '\')">' + o + '</button>'; }).join("") + '</div></div>';
  }).join("") +
  (r.cards.length < 5 ? '<div class="cta-row"><button class="btn ghost sm" onclick="addCard()">+ A card jumped out</button></div>' : '') +
  navrow(true, "Now read them");
}
function setOrient(i, o) { state.reading.cards[i].orient = o; saveState(); render(); }
function addCard() { state.reading.cards.push(blankCard()); saveState(); render(); }
function removeCard(i) { state.reading.cards.splice(i, 1); saveState(); render(); }

/* VI feel */
function stepFeel() {
  var r = state.reading;
  return title("Read each card <em>by feel.</em>", "<strong>No looking anything up yet.</strong> Just you and the card. Write the first thing, even if it seems random or weird. Weird is often the most accurate part.") +
  r.cards.map(function(c, i){
    if (!c.name.trim()) return "";
    var hint = c.orient === "reversed" ? '<div class="hint">Reversed. What\'s blocked here, and what would help it stand upright?</div>'
      : c.orient === "sideways" ? '<div class="hint">Sideways. Where is this energy forming, and where am I hesitating?</div>' : '';
    return '<div class="tcard"><div class="roman">' + ROMAN[i] + '</div><div class="cname">' + esc(cardLabel(c)) + '</div><div class="cpos">' + esc(posOf(r, i)) + '</div>' + hint + '<div class="divider">✦ ✦ ✦</div>' +
      fld(i, "first", "First impression", "One word, a feeling, a gut reaction.", "heavy, peaceful, she looks tired...") +
      fld(i, "colors", "Colors and setting", "What stands out? What does it feel like? What is the sky doing?", "lots of blue, calm but a little cold...") +
      fld(i, "draw", "What draws your eye", "A symbol, an object, where the figure looks, a word, a memory.", "the two moons on the chariot...") +
      fld(i, "body", "Your body", "Where do you feel this card? Throat, chest, stomach? Tight or open?", "my chest feels lighter...") +
      fld(i, "advice", "If this card were advice", "If your guides looked at you from above and handed you this card, what would they say?", "sit down, slow down, listen first...") +
    '</div>';
  }).join("") +
  '<div class="note" style="margin-top:18px"><div class="t">If your mind goes blank</div><p>That\'s okay. Sit with the card. Look at it like a movie you\'re rewatching, every time you notice something new. Typing feels hard? Use your phone\'s voice dictation.</p></div>' +
  navrow(true, "See the story");
}
function fld(i, k, l, h, ph) { return '<label class="fl">' + l + '<small>' + h + '</small></label><textarea placeholder="' + esc(ph) + '" oninput="setC(' + i + ',\'' + k + '\', this.value)">' + esc(state.reading.cards[i][k]) + '</textarea>'; }

/* VII story */
function stepStory() {
  var r = state.reading, named = r.cards.filter(function(c){ return c.name.trim(); });
  return title("See the <em>story.</em>", named.length > 1 ? "Look at your cards left to right like the frames of a film. If they were telling a story about your life right now, what would it be?" : "Look at your card one more time. If it were telling a story about your life right now, what would it be?") +
  '<div class="box this"><div class="t">Your question</div><div class="v" style="font-style:italic">' + esc(r.question || "No question written") + '</div>' +
    '<div class="d">' + named.map(function(c){ var i = r.cards.indexOf(c); return '<span style="color:var(--gold2);font-family:var(--serif)">' + ROMAN[i] + '</span> &nbsp;' + esc(cardLabel(c)) + ' <span style="opacity:.7">· ' + esc(posOf(r, i)) + '</span>'; }).join("<br>") + '</div></div>' +
  '<label class="fl">The story my cards are telling<small>Stream of consciousness. Let it flow.</small></label>' +
  '<textarea style="min-height:140px" oninput="setR(\'story\', this.value)" placeholder="I see...">' + esc(r.story) + '</textarea>' +
  '<section style="padding-bottom:0"><div class="head"><div class="eyebrow">The heart check</div><h3>Read it out loud. How does your body respond?</h3><p>The mind is loud, looping and panicky. The heart is slow, steady and loving. If something feels scary, ask whether that\'s the message or your fear projecting onto the card.</p></div>' +
    [["yes","It feels like a yes","Relaxing. Right. Something in me softens."],["tight","Something feels tight","Fear, or something real that wants healing."],["unsure","I\'m not sure yet","Totally normal. Write it down anyway."]].map(function(h){
      return '<button class="choice' + (r.heart === h[0] ? " on" : "") + '" onclick="setHeart(\'' + h[0] + '\')"><span class="v">' + h[1] + '</span><small>' + h[2] + '</small></button>'; }).join("") +
    (r.heart === "tight" ? '<p class="soft small" style="margin:6px 0 10px">You can pull one more card and ask, <em>"Please give me advice for this energy."</em> Go back to the Pull step to add it.</p>' : '') +
    (r.heart === "unsure" ? '<p class="soft small" style="margin:6px 0 10px">Some messages only make sense days or weeks later. That\'s exactly why we keep a journal.</p>' : '') +
    '<textarea style="min-height:70px;margin-top:6px" oninput="setR(\'heartNote\', this.value)" placeholder="Anything you noticed in your body (optional)">' + esc(r.heartNote) + '</textarea></section>' +
  navrow(true, "Now look it up");
}
function setHeart(h) { state.reading.heart = h; saveState(); render(); }

/* VIII look it up */
function stepLookup() {
  var r = state.reading;
  return title("Now <em>look it up.</em>", "") +
  '<div class="note" style="margin-top:-10px;margin-bottom:22px"><div class="t">Your read stays</div>' +
    '<p>Looking up the meaning doesn\'t cancel what you felt. It adds a layer. Think of the traditional meaning as the dictionary, and your intuition as the poem.</p>' +
    '<p>Sometimes the book confirms exactly what you wrote. Sometimes it opens a door you didn\'t see. Sometimes your message is different from the textbook, and that\'s completely okay. Even after years, I still open the guidebook on my own readings.</p></div>' +
  r.cards.map(function(c, i){
    if (!c.name.trim()) return "";
    var base = c.name.trim(), num = NUMWORDS[base.split(" ")[0]];
    var mine = [c.first, c.colors, c.draw, c.body, c.advice].filter(function(x){ return x && x.trim(); }).join(" / ");
    return '<div class="tcard"><div class="roman">' + ROMAN[i] + '</div><div class="cname">' + esc(cardLabel(c)) + '</div><div class="cpos">' + esc(posOf(r, i)) + '</div>' +
      '<div class="mine"><span class="t">What you felt first</span>' + (mine ? esc(mine) : '<span style="color:var(--soft)">Nothing written yet. That\'s okay.</span>') + '</div>' +
      '<div class="links">' +
        '<a class="btn ghost sm" href="' + g(base + (c.orient === "reversed" ? " reversed" : "") + " tarot card meaning") + '" target="_blank" rel="noopener">Search the meaning ↗</a>' +
        (num ? '<a class="btn quiet sm" href="' + g("numerology meaning of the number " + num) + '" target="_blank" rel="noopener">The number ' + num + ' ↗</a>' : '') +
        '<a class="btn quiet sm" href="' + g(base + " tarot card symbolism") + '" target="_blank" rel="noopener">Symbolism ↗</a>' +
      '</div><p class="soft small" style="text-align:center;margin-top:8px">Or open your deck\'s guidebook. For oracle cards, the guidebook is your best source.</p>' +
      fld(i, "lookup", "What the meaning says", "Just the keywords, or the line that stood out.", "rest, recuperation, letting the mind rest...") +
      fld(i, "lands", "What it adds to my read", "Where does it match what you felt? What\'s new? What did you notice that the book didn\'t say?", "I felt tired before I read that it means rest. The book didn\'t mention the moons, but they felt important...") +
    '</div>';
  }).join("") +
  navrow(true, "Close my reading");
}

/* IX close */
function stepClose() {
  var r = state.reading;
  return title("Close your <em>reading.</em>", "") +
  '<label class="fl" style="margin-top:0">The message I\'m taking with me<small>One or two sentences. What do you want to remember?</small></label>' +
  '<textarea oninput="setR(\'takeaway\', this.value)" placeholder="I\'m allowed to receive support without feeling like a burden.">' + esc(r.takeaway) + '</textarea>' +
  '<label class="fl">Final message card <small>Optional. I like to close my readings with one oracle card as the final word.</small></label>' +
  '<input type="text" value="' + esc(r.closing) + '" oninput="setR(\'closing\', this.value)" placeholder="Vulture Spirit: nothing is wasted">' +
  '<section style="padding-bottom:0"><div class="head"><div class="eyebrow">Clear and close</div></div><ul class="marks">' +
    '<li>Thank your guides out loud for the messages.</li>' +
    '<li>Take a photo of your spread. Some you\'ll want to sit with later.</li>' +
    '<li>Put the cards back one at a time, each in a random spot, then shuffle to clear the energy.</li>' +
    '<li>Drink some water. Readings take energy.</li>' +
  '</ul><p class="soft small" style="margin-top:16px">If anything felt heavy, say: <em>"Archangel Michael, please clear my energy and my space, and reset the energy of my cards."</em></p></section>' +
  '<div class="cta-row" style="margin-top:30px"><button class="btn" onclick="saveToJournal()">Save to my journal</button></div>' +
  '<div class="cta-row" style="margin-top:12px"><button class="btn quiet sm" onclick="copyText(readingText(state.reading))">Copy my reading</button><button class="btn quiet sm" onclick="downloadText(readingText(state.reading))">Download as text</button></div>' +
  '<div class="navrow"><button class="btn quiet" onclick="stepTo(7)">Back</button><span></span></div>' +
  '<div class="bookcard"><div class="mini">You did it</div><h3>Share it with <em>the community.</em></h3><p>Post your spread and your read. Other members will add their perspective, and you\'ll see how many ways one spread can speak. Add a photo of your cards to the post.</p>' +
    '<button class="btn xl" onclick="copyText(skoolPost(state.reading))">Copy my community post</button><div class="mini">Then paste it into a new post</div></div>';
}
function saveToJournal() {
  var r = state.reading;
  if (!r.cards.some(function(c){ return c.name.trim(); })) { toast("Add at least one card first"); return; }
  var e = JSON.parse(JSON.stringify(r)); e.date = new Date().toISOString();
  state.journal.unshift(e); state.reading = blankReading(); state.step = 0; state.openEntry = 0;
  saveState(); go("journal"); toast("Saved to your journal");
}

/* ================= EXPORT ================= */
function readingText(r) {
  var o = [];
  if (r.date) o.push(new Date(r.date).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }));
  o.push("QUESTION: " + (r.question || "(none)"));
  if (SPREADS[r.spread]) o.push("SPREAD: " + SPREADS[r.spread].name);
  o.push("");
  r.cards.forEach(function(c, i){
    if (!c.name.trim()) return;
    o.push(ROMAN[i] + ". " + cardLabel(c) + " | " + posOf(r, i));
    [["first","First impression"],["colors","Colors"],["draw","Drew my eye"],["body","Body"],["advice","As advice"],["lookup","Traditional meaning"],["lands","What it added"]].forEach(function(f){ if (c[f[0]]) o.push("   " + f[1] + ": " + c[f[0]]); });
    o.push("");
  });
  if (r.story) o.push("THE STORY: " + r.story, "");
  if (r.heart) o.push("HEART CHECK: " + ({ yes: "Feels like a yes", tight: "Something feels tight", unsure: "Not sure yet" })[r.heart] + (r.heartNote ? " (" + r.heartNote + ")" : ""), "");
  if (r.closing) o.push("FINAL MESSAGE CARD: " + r.closing);
  if (r.takeaway) o.push("MY TAKEAWAY: " + r.takeaway);
  o.push("", "The Intuition Activator · Premium · Luana Spirits");
  return o.join("\n").trim();
}
function skoolPost(r) {
  var o = ["\u2728 My Intuition Activator reading", "", "Question: " + (r.question || "(open)")];
  if (SPREADS[r.spread]) o.push("Spread: " + SPREADS[r.spread].name);
  o.push("");
  r.cards.forEach(function(c, i){
    if (!c.name.trim()) return;
    o.push(ROMAN[i] + ". " + cardLabel(c) + " (" + posOf(r, i) + ")");
    var felt = [c.first, c.draw, c.advice].filter(function(x){ return x && x.trim(); }).join(" / ");
    if (felt) o.push("What I felt: " + felt);
    if (c.lands) o.push("What the meaning added: " + c.lands);
    o.push("");
  });
  if (r.story) o.push("The story I see: " + r.story, "");
  if (r.takeaway) o.push("My takeaway: " + r.takeaway, "");
  o.push("What do you all see in this spread? \uD83D\uDC9C");
  return o.join("\n");
}
function copyText(t) {
  function fb() { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Couldn't copy"); } ta.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast("Copied"); }, fb); else fb();
}
function downloadText(t) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" })); a.download = "my-tarot-reading.txt";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ================= JOURNAL ================= */
function journalTab() {
  var j = state.journal;
  return '<main class="wrap">' + pageHead("Intuition journal", "Your readings, <em>kept.</em>", "Sometimes a message arrives before your mind knows what it\'s about. Then one day you look back and go, oh, that\'s what that was. That moment is how your confidence grows.") +
  '<p class="soft" style="font-size:13.5px;margin-bottom:20px">Saved privately in this browser, on this device. Copy any reading to keep it somewhere else too.</p>' +
  (j.length ? j.map(function(e, i){
    var cards = e.cards.filter(function(c){ return c.name.trim(); }).map(cardLabel).join(" · ");
    return '<div class="j"><div class="date">' + new Date(e.date).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) + '</div>' +
      '<div class="q">' + esc(e.question || "Untitled reading") + '</div><div class="cards">' + esc(cards) + '</div>' +
      (e.takeaway ? '<div class="take">' + esc(e.takeaway) + '</div>' : '') +
      (state.openEntry === i ? '<div class="full">' + esc(readingText(e)) + '</div>' : '') +
      '<div class="acts"><button class="btn quiet sm" onclick="toggleEntry(' + i + ')">' + (state.openEntry === i ? "Hide" : "Open") + '</button>' +
      '<button class="btn quiet sm" onclick="copyText(readingText(state.journal[' + i + ']))">Copy</button>' +
      '<button class="btn quiet sm" onclick="copyText(skoolPost(state.journal[' + i + ']))">Community post</button>' +
      '<button class="btn quiet sm" onclick="deleteEntry(' + i + ')">Delete</button></div></div>';
  }).join("") + '<div class="cta-row" style="margin-top:20px"><button class="btn" onclick="state.reading=blankReading();state.step=0;saveState();go(\'read\')">Do another reading</button></div>'
  : '<div class="box this" style="align-items:center;text-align:center;padding:34px 20px"><div class="v">No readings yet.</div><div class="d">Your first one is waiting.</div><button class="btn" style="margin-top:10px" onclick="startReading()">Start my first reading</button></div>') +
  '</main>';
}
function toggleEntry(i) { state.openEntry = state.openEntry === i ? -1 : i; render(); }
function deleteEntry(i) { if (!confirm("Delete this reading from your journal?")) return; state.journal.splice(i, 1); state.openEntry = -1; saveState(); render(); }

/* ================= GO DEEPER ================= */

/* ================= BOOKING BAR ================= */
function barCheck() {
  var bar = document.getElementById("bookbar"); if (!bar) return; bar.classList.remove("show"); return;
  var show;
  if (state.tab === "welcome") { var st = document.querySelector(".story"); show = !!st && st.getBoundingClientRect().bottom < 0; }
  else if (state.tab === "read") show = false;
  else show = true;
  bar.classList.toggle("show", show);
}

/* ================= RENDER ================= */
function render() {
  var views = { welcome: welcome, learn: learn, advanced: advanced, read: readTab, journal: journalTab, deeper: deeper };
  document.getElementById("app").innerHTML = topbar() + (views[state.tab] || welcome)() + footer();
  barCheck();
  saveState();
}
loadState();
render();
window.addEventListener("scroll", barCheck, { passive: true }); barCheck();
</script>
</body>
</html>
